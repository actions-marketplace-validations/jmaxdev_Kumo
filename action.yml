name: 'Setup Kumo'
description: 'Fast, zero-trust package management and CI runner for Node.js projects'
branding:
  icon: 'box'
  color: 'blue'

inputs:
  version:
    description: 'Version of Kumo CLI to install (e.g. latest, v1.0.2)'
    required: false
    default: 'latest'
  cache:
    description: 'Enable automatic caching of ~/.kumo/store'
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether the store cache was restored successfully'
    value: ${{ steps.cache-store.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Cache Kumo Store
      if: inputs.cache == 'true'
      id: cache-store
      uses: actions/cache@v4
      with:
        path: ~/.kumo/store
        key: kumo-${{ runner.os }}-${{ hashFiles('**/kumo.lock', '**/package.json') }}
        restore-keys: |
          kumo-${{ runner.os }}-

    - name: Download & Install Kumo Binary
      shell: bash
      run: |
        set -e

        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"

        if [ "$OS" = "darwin" ]; then
          if [ "$ARCH" = "x86_64" ]; then
            FILENAME="kumo-macos.tar.gz"
          else
            FILENAME="kumo-macos-arm64.tar.gz"
          fi
        elif [ "$OS" = "linux" ]; then
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            FILENAME="kumo-linux-arm64.tar.gz"
          else
            FILENAME="kumo-linux-amd64.tar.gz"
          fi
        elif [[ "$OS" == *"mingw"* || "$OS" == *"msys"* || "$OS" == *"cygwin"* ]]; then
          FILENAME="kumo-windows-amd64.zip"
        else
          echo "::error::Unsupported operating system: $OS"
          exit 1
        fi

        if [ "${{ inputs.version }}" = "latest" ]; then
          URL="https://github.com/jmaxdev/Kumo/releases/latest/download/${FILENAME}"
        else
          URL="https://github.com/jmaxdev/Kumo/releases/download/${{ inputs.version }}/${FILENAME}"
        fi

        INSTALL_DIR="$HOME/.kumo/bin"
        mkdir -p "$INSTALL_DIR"
        TEMP_DIR=$(mktemp -d)

        echo "Downloading Kumo from $URL..."
        if ! curl -fsSL "$URL" -o "$TEMP_DIR/$FILENAME"; then
          echo "::error::Failed to download Kumo binary from $URL. Ensure version '${{ inputs.version }}' release exists on GitHub Releases."
          exit 1
        fi

        echo "Extracting Kumo..."
        if [[ "$FILENAME" == *.zip ]]; then
          unzip -q "$TEMP_DIR/$FILENAME" -d "$TEMP_DIR"
        else
          tar -xzf "$TEMP_DIR/$FILENAME" -C "$TEMP_DIR"
        fi

        find "$TEMP_DIR" -type f \( -name "kumo" -o -name "kumo.exe" -o -name "kx" -o -name "kx.exe" \) -exec mv {} "$INSTALL_DIR/" \;
        chmod +x "$INSTALL_DIR"/kumo* "$INSTALL_DIR"/kx* 2>/dev/null || true
        rm -rf "$TEMP_DIR"

        if [ ! -f "$INSTALL_DIR/kumo" ] && [ ! -f "$INSTALL_DIR/kumo.exe" ]; then
          echo "::error::Kumo binary installation failed."
          exit 1
        fi

        echo "$INSTALL_DIR" >> $GITHUB_PATH
        echo "Kumo installed successfully in $INSTALL_DIR"
