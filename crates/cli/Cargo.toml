[package]
name = "cli"
version = "0.3.3-alpha.10"
edition = "2021"

[dependencies]
kumo-core = { path = "../core" }
resolver = { path = "../resolver" }
security = { path = "../security" }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yml = "0.0.12"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
indicatif = "0.18"
dirs = "6.0"
reqwest = { version = "0.13", features = ["json", "rustls", "rustls-native-certs", "stream"] }
futures = "0.3"
num_cpus = "1.17"
semver = "1.0"
self-replace = "1.5"
zip = "8.6"
flate2 = "1.1"
tar = "0.4"
rayon = "1.12"
filetime = "0.2"
glob = "0.3.3"
dialoguer = "0.11"
console = "0.15"
paste = "1.0"
async-trait = "0.1"
oxc_allocator = "0.137.0"
oxc_parser = "0.137.0"
oxc_span = "0.137.0"
oxc_semantic = "0.137.0"
oxc_transformer = "0.137.0"
oxc_codegen = "0.137.0"

[[bin]]
name = "kumo"
path = "src/main.rs"

[[bin]]
name = "kx"
path = "src/kx.rs"

[build-dependencies]
winres = "0.1"


