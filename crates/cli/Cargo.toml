[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
core = { path = "../core" }
resolver = { path = "../resolver" }
security = { path = "../security" }

[[bin]]
name = "kumo"
path = "src/main.rs"

[[bin]]
name = "kx"
path = "src/kx.rs"

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
indicatif = "0.17"
dirs = "5.0"
reqwest = "0.11"
futures = "0.3"
num_cpus = "1.16"




