[package]
name = "kumo-core"
version = "0.1.12"
edition = "2021"

[dependencies]
blake3 = "1.5"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.4"
tar = "0.4"
flate2 = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
tempfile = "3.10"
