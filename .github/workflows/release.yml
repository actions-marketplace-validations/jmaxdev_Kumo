name: Release

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Run Cargo Check before building
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Kumo
        run: cargo check
  get-version:
    name: Get Version
    runs-on: ubuntu-22.04
    needs: test
    outputs:
      new_tag: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get current version
        id: get-version
        run: |
          NEW_VERSION=$(grep -m 1 '^version = ' crates/cli/Cargo.toml | cut -d '"' -f 2)
          echo "version=v$NEW_VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: get-version
    strategy:
      matrix:
        os: [
          windows-2022,
          ubuntu-22.04,
          macos-14
        ]
        include:
          - os: windows-2022
            artifact_name: kumo-windows.zip
            asset_name: kumo.exe
            kx_name: kx.exe
          - os: ubuntu-22.04
            artifact_name: kumo-linux.tar.gz
            asset_name: kumo
            kx_name: kx
          - os: macos-14
            artifact_name: kumo-macos.tar.gz
            asset_name: kumo
            kx_name: kx

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build Kumo
      run: cargo build --release
      env:
        CARGO_INCREMENTAL: 0
        CARGO_TERM_COLOR: always

    - name: Prepare Artifacts (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        mkdir bin
        cp target/release/kumo.exe bin/
        cp target/release/kx.exe bin/
        7z a ${{ matrix.artifact_name }} ./bin/*

    - name: Prepare Artifacts (Unix)
      if: matrix.os != 'windows-2022'
      run: |
        mkdir bin
        cp target/release/kumo bin/
        cp target/release/kx bin/
        tar -czf ${{ matrix.artifact_name }} -C bin .

    - name: Generate Checksums
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          certutil -hashfile ${{ matrix.artifact_name }} SHA256 > ${{ matrix.artifact_name }}.sha256
        else
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
        fi
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-build
        path: |
          ${{ matrix.artifact_name }}
          ${{ matrix.artifact_name }}.sha256

  release:
    name: Create GitHub Release
    needs: [build, get-version, test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-version.outputs.new_tag }}
          files: |
            windows-2022-build/kumo-windows.zip
            windows-2022-build/kumo-windows.zip.sha256
            ubuntu-22.04-build/kumo-linux.tar.gz
            ubuntu-22.04-build/kumo-linux.tar.gz.sha256
            macos-14-build/kumo-macos.tar.gz
            macos-14-build/kumo-macos.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ contains(needs.get-version.outputs.new_tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: [release, get-version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jmaxdev/kumo
          tags: |
            type=semver,pattern={{version}},value=${{ needs.get-version.outputs.new_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.get-version.outputs.new_tag }}
            type=semver,pattern={{major}},value=${{ needs.get-version.outputs.new_tag }}
            type=raw,value=latest,enable=${{ !contains(needs.get-version.outputs.new_tag, '-') }}
            type=raw,value=next,enable=${{ contains(needs.get-version.outputs.new_tag, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

