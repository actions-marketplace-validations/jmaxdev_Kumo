name: Release

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    name: Run Cargo Check before building
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Kumo
        run: cargo check
  get-version:
    name: Get Version
    runs-on: ubuntu-22.04
    needs: test
    outputs:
      new_tag: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get current version
        id: get-version
        run: |
          NEW_VERSION=$(grep -m 1 'version = ' Cargo.toml | cut -d '"' -f 2 | tr -d '\r')
          echo "version=v$NEW_VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build for ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    needs: get-version
    strategy:
      matrix:
        include:
          - os: windows-2022
            job_name: Windows x64
            target: x86_64-pc-windows-msvc
            artifact_name: kumo-windows-amd64.zip
            asset_name: kumo.exe
            kx_name: kx.exe

          - os: ubuntu-22.04
            job_name: Linux x64 (amd64)
            target: x86_64-unknown-linux-gnu
            artifact_name: kumo-linux-amd64.tar.gz
            asset_name: kumo
            kx_name: kx

          - os: ubuntu-22.04
            job_name: Linux arm64 (aarch64)
            target: aarch64-unknown-linux-gnu
            artifact_name: kumo-linux-arm64.tar.gz
            asset_name: kumo
            kx_name: kx

          - os: macos-14
            job_name: macOS arm64
            target: aarch64-apple-darwin
            artifact_name: kumo-macos-arm64.tar.gz
            asset_name: kumo
            kx_name: kx

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Setup cross-compilation for ARM64 Linux
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        rustup target add aarch64-unknown-linux-gnu
        sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build Kumo
      run: cargo build --release --target ${{ matrix.target }}
      env:
        CARGO_INCREMENTAL: 0
        CARGO_TERM_COLOR: always
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    - name: Prepare Artifacts (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        $passStr = [System.Guid]::NewGuid().ToString("N")
        $secPass = ConvertTo-SecureString -String $passStr -Force -AsPlainText

        $cert = New-SelfSignedCertificate `
          -Type CodeSigningCert `
          -Subject "CN=Kumo Package Manager, O=JMaxDev, OU=Kumo Security" `
          -FriendlyName "Kumo Package Manager Code Signing" `
          -NotAfter (Get-Date).AddYears(10) `
          -CertStoreLocation Cert:\CurrentUser\My

        $certPath = "$env:TEMP\kumo_$([System.Guid]::NewGuid().ToString('N')).pfx"
        Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $secPass | Out-Null

        $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
        if ($signtool) {
          & $signtool sign /f $certPath /p $passStr /d "Kumo Package Manager" /du "https://github.com/jmaxdev/kumo" /tr http://timestamp.digicert.com /td sha256 /fd sha256 target/${{ matrix.target }}/release/kumo.exe
          & $signtool sign /f $certPath /p $passStr /d "Kumo Executable Runner" /du "https://github.com/jmaxdev/kumo" /tr http://timestamp.digicert.com /td sha256 /fd sha256 target/${{ matrix.target }}/release/kx.exe
        }
        Remove-Item $certPath -ErrorAction SilentlyContinue

        mkdir bin
        cp target/${{ matrix.target }}/release/kumo.exe bin/
        cp target/${{ matrix.target }}/release/kx.exe bin/
        7z a ${{ matrix.artifact_name }} ./bin/*
        cp ${{ matrix.artifact_name }} kumo-windows.zip
      shell: powershell

    - name: Prepare Artifacts (Unix)
      if: matrix.os != 'windows-2022'
      run: |
        if [[ "${{ matrix.target }}" == *"apple-darwin"* ]]; then
          echo "Applying Ad-Hoc Code Signing for macOS binaries..."
          codesign --force -s - target/${{ matrix.target }}/release/kumo
          codesign --force -s - target/${{ matrix.target }}/release/kx
        fi

        mkdir bin
        cp target/${{ matrix.target }}/release/kumo bin/
        cp target/${{ matrix.target }}/release/kx bin/
        tar -czf ${{ matrix.artifact_name }} -C bin .
        if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
          cp ${{ matrix.artifact_name }} kumo-linux.tar.gz
        elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
          cp ${{ matrix.artifact_name }} kumo-macos.tar.gz
        fi
      shell: bash

    - name: Generate Checksums
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          certutil -hashfile ${{ matrix.artifact_name }} SHA256 > ${{ matrix.artifact_name }}.sha256
          certutil -hashfile kumo-windows.zip SHA256 > kumo-windows.zip.sha256
        else
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            shasum -a 256 kumo-linux.tar.gz > kumo-linux.tar.gz.sha256
          elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            shasum -a 256 kumo-macos.tar.gz > kumo-macos.tar.gz.sha256
          fi
        fi
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}-build
        path: |
          kumo-*

  release:
    name: Create GitHub Release
    needs: [build, get-version, test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.get-version.outputs.new_tag }}
          files: |
            x86_64-pc-windows-msvc-build/kumo-windows-amd64.zip
            x86_64-pc-windows-msvc-build/kumo-windows-amd64.zip.sha256
            x86_64-pc-windows-msvc-build/kumo-windows.zip
            x86_64-pc-windows-msvc-build/kumo-windows.zip.sha256
            x86_64-unknown-linux-gnu-build/kumo-linux-amd64.tar.gz
            x86_64-unknown-linux-gnu-build/kumo-linux-amd64.tar.gz.sha256
            x86_64-unknown-linux-gnu-build/kumo-linux.tar.gz
            x86_64-unknown-linux-gnu-build/kumo-linux.tar.gz.sha256
            aarch64-unknown-linux-gnu-build/kumo-linux-arm64.tar.gz
            aarch64-unknown-linux-gnu-build/kumo-linux-arm64.tar.gz.sha256
            aarch64-apple-darwin-build/kumo-macos-arm64.tar.gz
            aarch64-apple-darwin-build/kumo-macos-arm64.tar.gz.sha256
            aarch64-apple-darwin-build/kumo-macos.tar.gz
            aarch64-apple-darwin-build/kumo-macos.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ contains(needs.get-version.outputs.new_tag, '-') }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


