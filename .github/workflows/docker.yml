name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Kumo version to build (without leading v, e.g. 0.3.3)"
        required: true
      prerelease:
        description: "Treat as prerelease (skips mutable tags)"
        type: boolean
        default: false

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: meta
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
            prerelease="${{ github.event.release.prerelease }}"
          else
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
            prerelease="${{ github.event.inputs.prerelease }}"
          fi
          major="${version%%.*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          image="ghcr.io/${{ github.repository_owner }}/kumo"
          version="${{ steps.meta.outputs.version }}"
          major="${{ steps.meta.outputs.major }}"
          prerelease="${{ steps.meta.outputs.prerelease }}"
          
          tags="${image}:${version}"
          if [ "$prerelease" != "true" ]; then
            tags="${tags},${image}:${major},${image}:latest"
          else
            tags="${tags},${image}:next"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Download Kumo release assets
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p bin/amd64 bin/arm64
          
          # Download and extract AMD64 asset
          gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "kumo-linux-amd64.tar.gz" --dir /tmp
          tar -xzf /tmp/kumo-linux-amd64.tar.gz -C bin/amd64
          
          # Download and extract ARM64 asset
          gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "kumo-linux-arm64.tar.gz" --dir /tmp
          tar -xzf /tmp/kumo-linux-arm64.tar.gz -C bin/arm64
          
          ls -lR bin

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
